<script>
const moneyFmt=new Intl.NumberFormat('pt-BR',{style:'currency',currency:'BRL',maximumFractionDigits:0}),numFmt=new Intl.NumberFormat('pt-BR',{maximumFractionDigits:1});const pages={dashboard:'Visão geral',properties:'Empreendimentos',search:'Busca inteligente',clients:'Clientes',import:'Importar dados'};let properties=window.INITIAL_PROPERTIES;let clients=[];let savedSearch=JSON.parse(localStorage.getItem('ci_searches')||'[]').map((s,i)=>typeof s==='string'?{name:'Pesquisa '+(i+1),text:s,strictPrice:true,strictRegion:false,strictRooms:false}:s);let active='dashboard',query='',categoryFilter='',regionFilter='',sortBy='compat';let importRows=[];const view=document.querySelector('#view');document.querySelector('#today').textContent=new Intl.DateTimeFormat('pt-BR',{dateStyle:'full'}).format(new Date());function persist(){}function h(s=''){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}function norm(s){return String(s||'').normalize('NFD').replace(/[\u0300-\u036f]/g,'').toLowerCase().trim()}function price(v){return v==null?'Valor sob consulta':moneyFmt.format(v)}function formatDelivery(value){if(!value)return 'A confirmar';const raw=String(value).trim();let m=raw.match(/^(\d{4})-(\d{2})-(\d{2})/);if(m){const date=new Date(Number(m[1]),Number(m[2])-1,Number(m[3]));return new Intl.DateTimeFormat('pt-BR',{month:'long',year:'numeric'}).format(date)}m=raw.match(/^(\d{1,2})\/(\d{1,2})\/(\d{4})$/);if(m){const date=new Date(Number(m[3]),Number(m[2])-1,Number(m[1]));return new Intl.DateTimeFormat('pt-BR',{month:'long',year:'numeric'}).format(date)}return raw}function parseDelivery(value){let raw=String(value||'').trim(),m=raw.match(/^(20\d{2})-(\d{2})-(\d{2})/);if(m)return `${m[1]}-${m[2]}-${m[3]}`;m=raw.match(/^(20\d{2})$/);if(m)return `${m[1]}-01-01`;m=raw.match(/^(\d{1,2})\/(\d{4})$/);if(m)return `${m[2]}-${m[1].padStart(2,'0')}-01`;let months={janeiro:'01',fevereiro:'02',marco:'03',abril:'04',maio:'05',junho:'06',julho:'07',agosto:'08',setembro:'09',outubro:'10',novembro:'11',dezembro:'12'};m=norm(raw).match(/(janeiro|fevereiro|marco|abril|maio|junho|julho|agosto|setembro|outubro|novembro|dezembro)\s+(?:de\s+)?(20\d{2})/);return m?`${m[2]}-${months[m[1]]}-01`:null}function years(x){if(x.delivery)return new Date(x.delivery+'T00:00:00').getFullYear();return x.deliveryRaw||'A confirmar'}function fcount(list,key){return list.reduce((a,x)=>(a[x[key]||'Não informado']=(a[x[key]||'Não informado']||0)+1,a),{})}function reviewReasons(x){let r=[];if(x.price==null)r.push('Preço não informado');if(!x.areaRaw)r.push('Metragem não informada');if(!x.deliveryRaw)r.push('Entrega não informada');if(x.availability!=='Confirmada')r.push('Disponibilidade a confirmar');if(!x.dataUpdatedAt)r.push('Data de atualização não registrada');else{let days=(Date.now()-new Date(x.dataUpdatedAt+'T00:00:00').getTime())/86400000;if(days>180)r.push('Dados sem confirmação há mais de 6 meses')}return r}function provenance(x){let origin=x.dataSource||(x.sourceSheet?'Planilha original · aba '+x.sourceSheet:'Cadastro manual');let date=x.dataUpdatedAt?new Intl.DateTimeFormat('pt-BR').format(new Date(x.dataUpdatedAt+'T00:00:00')):'Não registrada';return {origin,date}}function provenancePanel(x){let p=provenance(x),pending=reviewReasons(x);return `<article class="card panel" style="margin-top:16px"><div class="panel-head"><h2>Origem e atualização</h2><span>${h(p.date)}</span></div><p class="sub">Origem: ${h(p.origin)} · Disponibilidade: ${h(x.availability||'A confirmar')}</p>${pending.length?`<p class="notice" style="margin-top:10px"><b>Precisa conferir:</b> ${h(pending.join(' · '))}</p>`:'<p class="sub">Sem pendências de atualização registradas.</p>'}</article>`}function toast(msg,error=false){let n=document.createElement('div');n.className='toast'+(error?' error':'');n.textContent=msg;document.body.append(n);setTimeout(()=>n.remove(),2800)}function pageHead(title,desc,actions=''){return `<div class="page-head"><div><div class="eyebrow">Central Imobiliária · Londrina</div><h1>${title}</h1><p>${desc}</p></div><div class="actions">${actions}</div></div>`}function stat(label,value,note,icon){return `<article class="card stat"><div class="stat-top"><span class="stat-label">${label}</span><span class="stat-icon">${icon}</span></div><div class="stat-value">${value}</div><div class="stat-note">${note}</div></article>`}function cardProperty(x){let areas=x.areas||[];let area=areas.length?(areas.length>1?`${numFmt.format(Math.min(...areas))}–${numFmt.format(Math.max(...areas))} m²`:`${numFmt.format(areas[0])} m²`):'Área a confirmar';return `<article class="card property">${x.coverUrl?`<img class="property-cover" src="${h(x.coverUrl)}" alt="Imagem de apresentação de ${h(x.name)}" loading="lazy">`:''}<div class="property-top"><span class="pill gold">${h(x.category)}</span><span class="pill ${reviewReasons(x).length?'':'green'}">${reviewReasons(x).length?'Revisar dados':'Atualizado'}</span></div><h3>${h(x.name)}</h3><div class="sub">${h(x.developer)} · ${h(x.region||'Região a confirmar')}</div><div class="property-price">${price(x.price)} <small>${x.price?'valor informado':'na planilha'}</small></div><div class="facts"><span>⌖ ${area}</span><span>⌂ ${h(x.roomsRaw||'Quartos a confirmar')}</span><span>◷ ${h(years(x))}</span></div><div class="property-bottom"><span class="sub">Origem: ${h(x.sourceSheet||'Cadastro manual')}</span><button class="link" onclick="details('${h(x.id)}')">Ver ficha →</button></div></article>`}function renderDashboard(){let prices=properties.map(x=>x.price).filter(Number.isFinite),byRegion=fcount(properties,'region'),max=Math.max(1,...Object.values(byRegion));let upcoming=properties.filter(x=>x.delivery&&new Date(x.delivery).getFullYear()>=new Date().getFullYear()).length;let recent=[...properties].slice(-5).reverse();view.innerHTML=pageHead('Visão geral','Uma leitura rápida do portfólio imobiliário cadastrado.',`<button class="btn" onclick="go('search')">⌕ Pesquisar imóvel</button>`)+`<div class="grid stats">${stat('Empreendimentos',properties.length,'Em toda a base cadastrada','▦')}${stat('Categoria MCMV',properties.filter(x=>x.category==='MCMV').length,'Registros da aba MCMV','⌂')}${stat('Categoria Médio',properties.filter(x=>x.category==='Médio').length,'Registros da aba MÉDIO','◇')}${stat('Precisam de revisão',properties.filter(x=>reviewReasons(x).length).length,'Preço, disponibilidade ou dados sem confirmação','!')}</div><article class="card panel" style="margin-top:16px"><div class="panel-head"><h2>Cadastros para conferir</h2><span>Informações ausentes ou sem confirmação recente</span></div><div class="table-wrap"><table class="table"><thead><tr><th>EMPREENDIMENTO</th><th>PENDÊNCIAS</th><th></th></tr></thead><tbody>${properties.filter(x=>reviewReasons(x).length).slice(0,8).map(x=>`<tr><td><b>${h(x.name)}</b><small>${h(x.developer||'Construtora não informada')}</small></td><td>${h(reviewReasons(x).join(' · '))}</td><td><button class="link" onclick="propertyModal('${h(x.id)}')">Atualizar</button></td></tr>`).join('')||'<tr><td colspan="3">Todos os dados têm confirmação registrada.</td></tr>'}</tbody></table></div>${properties.filter(x=>reviewReasons(x).length).length>8?'<small class="sub">Mostrando os 8 primeiros. Consulte Empreendimentos para ver a carteira completa.</small>':''}</article><div class="grid dashboard-grid"><article class="card panel"><div class="panel-head"><h2>Empreendimentos por região</h2><span>${Object.keys(byRegion).length} localidades</span></div><div class="region-list">${Object.entries(byRegion).sort((a,b)=>b[1]-a[1]).slice(0,7).map(([r,n])=>`<div class="region-row"><span>${h(r)}</span><div class="bar"><i style="width:${Math.max(3,n/max*100)}%"></i></div><strong>${n}</strong></div>`).join('')||'<div class="empty">Nenhuma região informada</div>'}</div></article><article class="card panel"><div class="panel-head"><h2>Faixa de preços informados</h2><span>${prices.length} com preço</span></div>${prices.length?`<div class="price-range"><div><small class="sub">A partir de</small><br><strong>${price(Math.min(...prices))}</strong></div><div style="text-align:right"><small class="sub">Até</small><br><strong>${price(Math.max(...prices))}</strong></div></div><div class="price-track"></div><p class="sub" style="margin-top:15px">Valores conforme informados na planilha. Confirme disponibilidade e preço atual.</p>`:'<div class="empty">Preços ainda não cadastrados.</div>'}<div class="panel-head" style="margin:25px 0 2px"><h2>Entregas previstas</h2><span>com ano identificado</span></div><strong style="font:700 22px Manrope;color:var(--navy)">${upcoming}</strong><span class="sub"> empreendimentos</span></article></div><div class="grid dashboard-grid"><article class="card panel"><div class="panel-head"><h2>Adicionados recentemente</h2><button class="link" onclick="go('properties')">Ver todos →</button></div>${recent.map(x=>`<div class="recent-row"><div><b>${h(x.name)}</b><small>${h(x.developer)} · ${h(x.region)}</small></div><em>${price(x.price)}</em></div>`).join('')||'<div class="empty">Ainda sem empreendimentos.</div>'}</article><article class="card panel"><div class="panel-head"><h2>Acesso rápido</h2><span>Atalhos</span></div><div class="grid shortcuts" style="grid-template-columns:1fr 1fr"><button class="card shortcut" onclick="go('search')"><span class="stat-icon">⌕</span><span><b>Iniciar pesquisa</b><small>Encontre imóveis pelo perfil</small></span></button><button class="card shortcut" onclick="go('clients');setTimeout(()=>clientModal(),0)"><span class="stat-icon">♙</span><span><b>Cadastrar cliente</b><small>Guardar critérios de busca</small></span></button></div></article></div>`}
function filtered(){return properties.filter(x=>(!query||norm([x.name,x.developer,x.region,x.category,x.areaRaw].join(' ')).includes(norm(query)))&&(!categoryFilter||x.category===categoryFilter)&&(!regionFilter||norm(x.region).includes(norm(regionFilter))))}function renderProperties(){let list=filtered();view.innerHTML=pageHead('Empreendimentos','Consulte a carteira e os dados originais de cada empreendimento.',``)+`<div class="card filters"><div class="field"><label>Buscar empreendimento</label><input id="q" placeholder="Nome, construtora ou região" value="${h(query)}" oninput="query=this.value;renderProperties();document.querySelector('#q').focus();document.querySelector('#q').setSelectionRange(query.length,query.length)"></div><div class="field"><label>Categoria</label><select id="cat" onchange="categoryFilter=this.value;renderProperties()"><option value="">Todas</option><option ${categoryFilter==='MCMV'?'selected':''}>MCMV</option><option ${categoryFilter==='Médio'?'selected':''}>Médio</option></select></div><div class="field"><label>Região</label><select onchange="regionFilter=this.value;renderProperties()"><option value="">Todas as regiões</option>${[...new Set(properties.map(x=>x.region).filter(Boolean))].sort().map(v=>`<option ${regionFilter===v?'selected':''} value="${h(v)}">${h(v)}</option>`).join('')}</select></div><div class="field"><label>Ordenar por</label><select onchange="sortBy=this.value;renderProperties()"><option value="name">Nome</option><option value="price" ${sortBy==='price'?'selected':''}>Menor preço</option><option value="delivery" ${sortBy==='delivery'?'selected':''}>Entrega</option></select></div><button class="btn" onclick="query='';categoryFilter='';regionFilter='';renderProperties()">Limpar</button></div><div class="results-head"><span><b>${list.length}</b> resultado${list.length===1?'':'s'}</span><span>Campos vazios permanecem sem preenchimento</span></div><div class="property-list">${(sortBy==='price'?[...list].sort((a,b)=>(a.price??Infinity)-(b.price??Infinity)):sortBy==='delivery'?[...list].sort((a,b)=>(a.delivery||'9999').localeCompare(b.delivery||'9999')):[...list].sort((a,b)=>a.name.localeCompare(b.name))).map(cardProperty).join('')||'<div class="card empty" style="grid-column:1/-1"><b>Nenhum resultado</b>Ajuste os filtros para consultar outros empreendimentos.</div>'}</div>`}function availabilityTabs(x){let count=x.availabilityTable?.units?.length||0;return `<div class="availability-tabs"><button type="button" class="availability-tab active" data-availability-tab="ficha" onclick="setAvailabilityTab('ficha')">Ficha do empreendimento</button><button type="button" class="availability-tab" data-availability-tab="unidades" onclick="setAvailabilityTab('unidades')">Unidades disponíveis (${count})</button></div><div id="availability-ficha-pane">`}
function setAvailabilityTab(tab){let ficha=document.querySelector('#availability-ficha-pane'),units=document.querySelector('#availability-units-pane');if(!ficha||!units)return;ficha.style.display=tab==='ficha'?'':'none';units.style.display=tab==='unidades'?'':'none';document.querySelectorAll('[data-availability-tab]').forEach(b=>b.classList.toggle('active',b.dataset.availabilityTab===tab))}
function availabilityUnitsPane(x){let t=x.availabilityTable;if(!t)return '';let rows=t.units.map(u=>`<tr data-unit-search="${h([u.unidade,u.areaPrivativa,u.tipologia,u.situacao,u.valorTotal].join(' '))}"><td><b>${h(u.unidade)}</b></td><td>${Number(u.areaPrivativa).toLocaleString('pt-BR',{minimumFractionDigits:2,maximumFractionDigits:2})} m²</td><td>${h(u.tipologia)}</td><td><span class="pill">${h(u.situacao)}</span></td><td><b>${Number(u.valorTotal).toLocaleString('pt-BR',{style:'currency',currency:'BRL',minimumFractionDigits:2,maximumFractionDigits:2})}</b></td></tr>`).join('');return `<div id="availability-units-pane" style="display:none"><div class="card panel"><div class="panel-head"><div><h2>Unidades da tabela</h2><p class="sub">Tabela oficial · ${h(t.label)} · gerada em ${h(t.generatedOn)}</p></div><a class="btn small" href="${h(t.pdf)}" target="_blank" rel="noopener">↗ Abrir PDF original</a></div><div class="notice" style="margin:12px 0">Valores e situações conforme a tabela recebida. Confirme a disponibilidade antes de apresentar uma proposta.</div><div class="units-toolbar"><div class="field" style="flex:1;min-width:220px"><label>Filtrar unidades</label><input type="search" placeholder="Unidade, tipologia ou valor" oninput="filterAvailabilityUnits(this.value)"></div><span class="sub" id="availability-units-count">${t.units.length} unidades</span></div>${t.units.length?`<div class="table-wrap"><table class="table"><thead><tr><th>UNIDADE</th><th>ÁREA PRIVATIVA</th><th>TIPOLOGIA</th><th>SITUAÇÃO</th><th>VALOR TOTAL</th></tr></thead><tbody>${rows}</tbody></table></div>`:`<div class="notice" style="margin:12px 0">O PDF original está disponível para consulta. As unidades ainda não foram transcritas para esta tabela.</div><iframe title="Tabela de preços Living Residence" src="${h(t.pdf)}" style="width:100%;height:72vh;border:1px solid var(--line);border-radius:12px"></iframe>`}</div></div>`}
function filterAvailabilityUnits(value){let needle=norm(value),rows=[...document.querySelectorAll('#availability-units-pane [data-unit-search]')],visible=0;rows.forEach(row=>{let show=norm(row.dataset.unitSearch).includes(needle);row.style.display=show?'':'none';if(show)visible++});let count=document.querySelector('#availability-units-count');if(count)count.textContent=`${visible} ${visible===1?'unidade':'unidades'}`}

function catalogTypologyRows(c){if(!c.typologies||!c.typologies.length)return '<tr><td colspan="4" class="sub">As tipologias não puderam ser confirmadas no texto extraído do catálogo. Consulte o PDF anexado ou atualize os dados após conferência.</td></tr>';return c.typologies.map(t=>{let room=t.bedrooms==null?'dormitórios a confirmar':`${t.bedrooms} ${t.bedrooms===1?'quarto':'quartos'}`;let suite=t.suites==null?'suíte a confirmar':t.suites===0?'sem suíte':`${t.suites} ${t.suites===1?'suíte':'suítes'}`;let area=t.area==null?'metragem a confirmar':`${numFmt.format(t.area)} m² ${t.areaTipo==='total'?'(área total)':'(área privativa)'}`;let extra=t.areaComplementar==null?'':`<div class="sub">+ ${numFmt.format(t.areaComplementar)} m² de área complementar</div>`;return `<tr><td><b>${h(t.name)}</b></td><td>${room} / ${suite}</td><td>${area}${extra}</td><td>${h(t.parking||'Não informado')}</td></tr>`}).join('')}
function catalogSection(x){let c=x.catalogInfo;if(!c)return '';return `<article class="card panel" style="margin-top:18px;border-color:#e5dcc9"><div class="panel-head"><h2>Informações do catálogo</h2>${c.catalogs.map((item,i)=>`<a class="btn small" style="margin-left:6px" href="${h(item.url)}" target="_blank" rel="noopener">↗ ${h(item.name||`Catálogo ${i+1}`)}</a>`).join('')}</div><p style="font-size:12px;line-height:1.65;color:#526174">${h(c.summary)}</p>${c.review?`<div class="notice" style="margin:12px 0">${h(c.review)}</div>`:''}<div class="panel-head" style="margin:17px 0 9px"><h2>Tipologias apresentadas</h2><span>Conforme catálogo</span></div><div class="table-wrap"><table class="table"><thead><tr><th>PLANTA</th><th>QUARTOS / SUÍTES</th><th>ÁREA</th><th>VAGAS</th></tr></thead><tbody>${catalogTypologyRows(c)}</tbody></table></div><div class="panel-head" style="margin:17px 0 9px"><h2>Lazer e áreas comuns</h2></div><div class="facts">${c.amenities.map(a=>`<span>• ${h(a)}</span>`).join('')}</div><div class="panel-head" style="margin:17px 0 9px"><h2>Diferenciais informados</h2></div><div class="facts">${c.features.map(a=>`<span>• ${h(a)}</span>`).join('')}</div><p class="sub" style="line-height:1.6;margin-top:15px">${h(c.source)}</p></article>`}function modal(content){document.querySelector('#overlay').innerHTML=`<div class="modal-back" onclick="if(event.target===this)closeModal()"><div class="modal">${content}</div></div>`}function closeModal(){document.querySelector('#overlay').innerHTML=''}function details(id){let x=properties.find(a=>a.id===id);if(!x)return;let raw=Object.entries(x.raw||{}).map(([k,v])=>`<tr><td>${h(k)}</td><td>${h(v??'')}</td></tr>`).join('');modal(`${x.coverUrl?`<img class="detail-cover" src="${h(x.coverUrl)}" alt="Imagem de apresentação de ${h(x.name)}">`:``}<div class="modal-head"><div><span class="pill gold">${h(x.category)} · ${h(x.sourceSheet)}</span><h2 style="margin-top:10px">${h(x.name)}</h2><div class="sub">${h(x.developer)} · ${h(x.region)}</div></div><button class="close" onclick="closeModal()">×</button></div><div class="grid stats" style="grid-template-columns:repeat(3,1fr)"><div class="card stat"><div class="stat-label">Preço informado</div><div class="stat-value" style="font-size:18px">${price(x.price)}</div></div><div class="card stat"><div class="stat-label">Metragem original</div><div class="stat-value" style="font-size:16px">${h(x.areaRaw||'—')}</div></div><div class="card stat"><div class="stat-label">Entrega informada</div><div class="stat-value" style="font-size:16px">${h(formatDelivery(x.deliveryRaw))}</div></div></div><div class="panel-head" style="margin-top:18px"><h2>Características cadastradas</h2><span>Conforme planilha</span></div><div class="facts">${Object.entries(x.features||{}).map(([k,v])=>`<span><b>${h(k)}:</b> ${h(v||'—')}</span>`).join('')||'Sem características adicionais'}</div>${catalogSection(x)}${provenancePanel(x)}<div class="notice" style="margin-top:16px">Origem: aba ${h(x.sourceSheet)}, linha ${x.sourceRow||'—'}. Os campos abaixo reproduzem os valores originais da planilha.</div><div class="table-wrap"><table class="table"><tbody>${raw}</tbody></table></div>${x.name==='HOME 433'?`</div>${availabilityUnitsPane(x)}`:''}<div class="modal-footer"><button class="btn" onclick="closeModal()">Fechar</button></div>`)}
function renderSearch(){view.innerHTML=pageHead('Busca inteligente','Combine critérios, confira correspondências e salve perfis frequentes.')+`<div class="search-layout"><aside class="card search-box"><div class="panel-head"><h2>Perfil de busca</h2></div><div class="field"><label>O que o cliente procura?</label><textarea id="searchText" placeholder="Ex.: apartamento na zona sul, 2 quartos, até R$ 450 mil, entrega em 2028">${h(query)}</textarea></div><div class="checks"><label><input type="checkbox" id="strictPrice" checked> Respeitar orçamento máximo</label><label><input type="checkbox" id="strictRegion"> Região é obrigatória</label><label><input type="checkbox" id="strictRooms"> Quartos são obrigatórios</label></div><button class="btn primary" style="width:100%;justify-content:center" onclick="runSearch()">⌕ Encontrar empreendimentos</button><button class="btn" style="width:100%;justify-content:center;margin-top:8px" onclick="saveCurrentSearch()">Salvar perfil de busca</button><div class="panel-head" style="margin:22px 0 10px"><h2>Pesquisas salvas</h2></div>${savedSearch.map((item,i)=>`<div class="recent-row"><button class="link" onclick="loadSavedSearch(${i})">${h(item.name||'Pesquisa '+(i+1))}<small>${h(item.text||'')}</small></button><button class="link" onclick="deleteSavedSearch(${i})">×</button></div>`).join('')||'<small class="sub">Nenhuma pesquisa salva ainda.</small>'}</aside><div id="searchResults"><article class="card panel"><div class="empty"><b>Comece pela necessidade do cliente</b>Descreva orçamento, localização e características desejadas para filtrar a base real.<br><br><span class="sub">A busca separa correspondências exatas de alternativas e informa o que precisa ser confirmado.</span></div></article></div></div>`}function saveCurrentSearch(){let text=document.querySelector('#searchText')?.value?.trim();if(!text)return toast('Digite uma pesquisa para salvar.',true);let name=prompt('Dê um nome para este perfil de busca:');if(!name)return;savedSearch.push({name:name.trim(),text,strictPrice:document.querySelector('#strictPrice').checked,strictRegion:document.querySelector('#strictRegion').checked,strictRooms:document.querySelector('#strictRooms').checked,savedAt:new Date().toISOString()});persist();toast('Perfil de busca salvo.');renderSearch()}function loadSavedSearch(i){let item=savedSearch[i];if(!item)return;query=item.text||'';renderSearch();document.querySelector('#searchText').value=query;document.querySelector('#strictPrice').checked=item.strictPrice!==false;document.querySelector('#strictRegion').checked=!!item.strictRegion;document.querySelector('#strictRooms').checked=!!item.strictRooms;runSearch()}function deleteSavedSearch(i){savedSearch.splice(i,1);persist();renderSearch();toast('Pesquisa removida.')}function runSearch(){let t=document.querySelector('#searchText').value;query=t;let budget=(t.match(/(?:ate|até|maximo|maximo|no maximo)\s*(?:r\$\s*)?([\d.,]+)\s*(mil|k)?/i)||[]);let maxPrice=null;if(budget[1]){maxPrice=parseFloat(budget[1].replace(/\./g,'').replace(',','.'));if(budget[2])maxPrice*=1000}let yearsMatch=t.match(/20\d{2}/),year=yearsMatch?yearsMatch[0]:null;let wanted=(t.match(/(\d)\s*(?:quartos?|q(?:uartos?)?)/i)||[])[1];let regionTerms=['zona sul','zona norte','zona leste','zona oeste','gleba palhano','palhano','terra bonita','aurora','cambé','aeroporto'];let rg=regionTerms.find(r=>norm(t).includes(norm(r)));let strictPrice=document.querySelector('#strictPrice').checked,strictRegion=document.querySelector('#strictRegion').checked,strictRooms=document.querySelector('#strictRooms').checked;let exact=[],alts=[],unknown=[];properties.forEach(x=>{let hasUnknown=[];let reasons=[];let failures=[];if(maxPrice){if(x.price==null)hasUnknown.push('preço');else if(x.price<=maxPrice)reasons.push('preço dentro do teto');else failures.push('preço acima do teto')}if(rg){if(!x.region)hasUnknown.push('região');else if(norm(x.region).includes(norm(rg))||norm(rg).includes(norm(x.region)))reasons.push('localização relacionada');else failures.push('região diferente')}if(wanted){if(!x.roomsRaw)hasUnknown.push('quartos');else if(norm(x.roomsRaw).includes(wanted))reasons.push('quantidade de quartos');else failures.push('quartos diferentes')}if(year){if(x.delivery){if(String(new Date(x.delivery+'T00:00:00').getFullYear())===year)reasons.push('entrega no ano desejado');else failures.push('entrega em outro ano')}else hasUnknown.push('entrega')}let requiredFailures=(maxPrice&&strictPrice?failures.filter(f=>f==='preço acima do teto'):[]).concat(rg&&strictRegion?failures.filter(f=>f==='região diferente'):[]).concat(wanted&&strictRooms?failures.filter(f=>f==='quartos diferentes'):[]);let item={x,reasons,failures,hasUnknown,score:reasons.length};if(requiredFailures.length) return;if(!failures.length&&!hasUnknown.length)exact.push(item);else if(item.score>0||hasUnknown.length)alts.push(item)});let scoreSort=(a,b)=>b.score-a.score;exact.sort(scoreSort);alts.sort(scoreSort);let results=document.querySelector('#searchResults');results.innerHTML=`<div class="notice">${exact.length?`Encontramos ${exact.length} correspondência${exact.length===1?'':'s'} exata${exact.length===1?'':'s'} com os critérios informados.`:'Não encontramos correspondências exatas para os critérios identificados.'} Critérios extraídos automaticamente do texto; revise a seleção antes de apresentar opções ao cliente.</div>${exact.length?`<div class="panel-head"><h2>Correspondências exatas</h2><span>${exact.length} imóveis</span></div><div class="property-list">${exact.map(({x,reasons})=>cardProperty(x).replace('</article>',`<p class="match-reason">✓ ${h(reasons.join(' · '))}</p></article>`)).join('')}</div>`:''}${alts.length?`<div class="panel-head" style="margin-top:23px"><h2>Alternativas para avaliar</h2><span>podem divergir em algum critério</span></div><div class="property-list">${alts.slice(0,12).map(({x,reasons,failures,hasUnknown})=>cardProperty(x).replace('</article>',`<p class="match-reason">${reasons.length?'✓ '+h(reasons.join(' · ')):''}${failures.length?'<br>• '+h(failures.join(' · ')):''}${hasUnknown.length?'<br>! Confirmar: '+h(hasUnknown.join(', ')):''}</p></article>`)).join('')}</div>`:''}${!exact.length&&!alts.length?'<article class="card empty"><b>Não há imóveis compatíveis na base</b>Experimente flexibilizar algum critério ou confirme os dados que ainda não foram cadastrados.</article>':''}`}
function renderClients(){view.innerHTML=pageHead('Clientes','Organize perfis, histórico e próximos passos comerciais.',`<button class="btn primary" onclick="clientModal()">＋ Cadastrar cliente</button>`)+`<div class="notice">Cadastre somente os dados necessários ao atendimento. Histórico e contatos ficam neste navegador.</div><article class="card panel table-wrap"><table class="table"><thead><tr><th>CLIENTE</th><th>ORÇAMENTO</th><th>PERFIL</th><th>ÚLTIMO CONTATO</th><th>PRÓXIMA AÇÃO</th><th>STATUS</th><th></th></tr></thead><tbody>${clients.map((c,i)=>`<tr><td><b>${h(c.name)}</b><small>${h(c.phone||c.email||'Contato não informado')}</small></td><td>${c.max?price(Number(c.max)):'—'}</td><td>${h([c.region,c.rooms&&c.rooms+' quartos'].filter(Boolean).join(' · ')||'Perfil em construção')}</td><td>${h(c.last||'—')}</td><td>${h(c.next||'—')}</td><td><span class="pill ${c.status==='Ativo'?'green':''}">${h(c.status||'Em atendimento')}</span></td><td class="td-actions"><button class="link" onclick="clientHistory(${i})">Histórico (${(c.history||[]).length})</button> <button class="link" onclick="clientModal(${i})">Editar</button> <button class="link" onclick="deleteClient(${i})">Arquivar</button></td></tr>`).join('')||'<tr><td colspan="7"><div class="empty"><b>Nenhum cliente cadastrado</b>Adicione um cliente para salvar preferências e organizar o atendimento.</div></td></tr>'}</tbody></table></article>`}function clientHistory(idx){let c=clients[idx];if(!c)return;c.history=c.history||[];let today=new Date(Date.now()-new Date().getTimezoneOffset()*60000).toISOString().slice(0,10);modal(`<div class="modal-head"><div><div class="eyebrow">Relacionamento · ${h(c.name)}</div><h2>Histórico de atendimento</h2></div><button class="close" onclick="closeModal()">×</button></div><div class="card panel"><div class="panel-head"><h2>Registrar atividade</h2></div><form id="historyForm"><div class="form-grid"><div class="field"><label>Tipo de atividade</label><select name="type"><option>Contato</option><option>Visita</option><option>Apresentação</option><option>Interesse em imóvel</option><option>Proposta</option><option>Negociação</option><option>Próximo passo</option></select></div><div class="field"><label>Data</label><input name="date" type="date" value="${today}" required></div><div class="field span2"><label>Empreendimento relacionado (opcional)</label><select name="propertyId"><option value="">Nenhum selecionado</option>${properties.map(x=>`<option value="${h(x.id)}">${h(x.name)}</option>`).join('')}</select></div><div class="field span2"><label>Resumo / observação</label><textarea name="note" rows="3" required placeholder="Registre o que foi combinado ou confirmado"></textarea></div></div><div class="modal-footer"><button class="btn primary">Salvar atividade</button></div></form></div><div class="panel-head" style="margin-top:18px"><h2>Atividades registradas</h2><span>${c.history.length}</span></div><div class="recent-list">${[...c.history].reverse().map((e,i)=>`<div class="recent-row"><div><b>${h(e.type||'Atividade')}</b><small>${h(e.date||'Data não informada')}${e.propertyName?' · '+h(e.propertyName):''}</small><div class="sub">${h(e.note||'')}</div></div><button class="link" onclick="removeClientEvent(${idx},${c.history.length-1-i})">Remover</button></div>`).join('')||'<div class="empty">Nenhuma atividade registrada.</div>'}</div>`);document.querySelector('#historyForm').onsubmit=e=>{e.preventDefault();let d=Object.fromEntries(new FormData(e.target)),prop=properties.find(x=>x.id===d.propertyId);c.history.push({type:d.type,date:d.date,note:d.note,propertyId:d.propertyId||'',propertyName:prop?.name||''});c.last=d.date;if(d.type==='Próximo passo')c.next=d.note;persist();clientHistory(idx);toast('Atividade registrada.')}}function removeClientEvent(idx,eventIdx){if(!confirm('Remover esta atividade do histórico?'))return;clients[idx].history.splice(eventIdx,1);persist();clientHistory(idx);toast('Atividade removida.')}function propertyModal(id){let x=properties.find(a=>a.id===id)||{};modal(`<div class="modal-head"><div><div class="eyebrow">Carteira imobiliária</div><h2>${id?'Editar empreendimento':'Novo empreendimento'}</h2></div><button class="close" onclick="closeModal()">×</button></div><form id="propForm"><div class="form-grid"><div class="field"><label>Nome do empreendimento *</label><input name="name" required value="${h(x.name||'')}"></div><div class="field"><label>Construtora</label><input name="developer" value="${h(x.developer||'')}"></div><div class="field"><label>Categoria</label><select name="category"><option ${x.category==='MCMV'?'selected':''}>MCMV</option><option ${x.category==='Médio'?'selected':''}>Médio</option><option ${!x.category?'selected':''}>Outro</option></select></div><div class="field"><label>Região / localidade</label><input name="region" value="${h(x.region||'')}"></div><div class="field"><label>Preço inicial (R$)</label><input name="price" type="number" min="0" step="0.01" value="${x.price??''}"></div><div class="field"><label>Previsão de entrega</label><input name="deliveryRaw" placeholder="Ex.: maio de 2028" value="${h(x.deliveryRaw||'')}"></div><div class="field"><label>Disponibilidade</label><select name="availability"><option value="" ${!x.availability?'selected':''}>A confirmar</option><option ${x.availability==='Confirmada'?'selected':''}>Confirmada</option><option ${x.availability==='Indisponível'?'selected':''}>Indisponível</option></select></div><div class="field"><label>Data da confirmação comercial</label><input name="dataUpdatedAt" type="date" value="${h(x.dataUpdatedAt||'')}"></div><div class="field span2"><label>Metragem / plantas</label><input name="areaRaw" value="${h(x.areaRaw||'')}"></div><div class="field span2"><label>Observações internas</label><textarea name="notes" rows="3">${h(x.notes||'')}</textarea></div></div><p class="sub">Informe a data somente quando preço, disponibilidade ou entrega tiverem sido confirmados.</p><div class="modal-footer"><button type="button" class="btn" onclick="closeModal()">Cancelar</button><button class="btn primary">Salvar cadastro</button></div></form>`);document.querySelector('#propForm').onsubmit=e=>{e.preventDefault();let d=Object.fromEntries(new FormData(e.target)),areas=(d.areaRaw.match(/\d+(?:[,.]\d+)?(?=\s*m²)/gi)||[]).map(v=>parseFloat(v.replace(',','.'))),delivery=parseDelivery(d.deliveryRaw);let updated={...x,...d,id:x.id||'manual-'+Date.now(),price:d.price?Number(d.price):null,areas,delivery,priceRaw:d.price?moneyFmt.format(Number(d.price)):'',roomsRaw:x.roomsRaw||'',sourceSheet:x.sourceSheet||'Cadastro manual',raw:x.raw||{},features:x.features||{},availability:d.availability||'',dataSource:'Atualizado manualmente',dataUpdatedAt:d.dataUpdatedAt||'',needsReview:true};updated.needsReview=reviewReasons(updated).length>0;if(id)properties=properties.map(a=>a.id===id?updated:a);else properties.unshift(updated);persist();closeModal();if(active==='dashboard')renderDashboard();else if(active==='properties')renderProperties();toast(id?'Cadastro atualizado.':'Empreendimento cadastrado.')}}function clientModal(idx){let c=idx!==undefined?clients[idx]:{};modal(`<div class="modal-head"><div><div class="eyebrow">Relacionamento</div><h2>${idx!==undefined?'Editar cliente':'Cadastrar cliente'}</h2></div><button class="close" onclick="closeModal()">×</button></div><form id="clientForm"><div class="form-grid"><div class="field"><label>Nome *</label><input name="name" required value="${h(c.name||'')}"></div><div class="field"><label>Telefone</label><input name="phone" value="${h(c.phone||'')}"></div><div class="field"><label>E-mail</label><input name="email" type="email" value="${h(c.email||'')}"></div><div class="field"><label>Orçamento máximo (R$)</label><input name="max" type="number" value="${h(c.max||'')}"></div><div class="field"><label>Região preferida</label><input name="region" value="${h(c.region||'')}"></div><div class="field"><label>Quartos</label><input name="rooms" type="number" min="0" value="${h(c.rooms||'')}"></div><div class="field"><label>Último contato</label><input name="last" type="date" value="${h(c.last||'')}"></div><div class="field"><label>Próxima ação</label><input name="next" placeholder="Ex.: Agendar visita" value="${h(c.next||'')}"></div><div class="field"><label>Status do atendimento</label><select name="status"><option ${!c.status||c.status==='Ativo'?'selected':''}>Ativo</option><option ${c.status==='Em negociação'?'selected':''}>Em negociação</option><option ${c.status==='Aguardando'?'selected':''}>Aguardando</option></select></div><div class="field span2"><label>Observações comerciais</label><textarea name="notes" rows="3">${h(c.notes||'')}</textarea></div></div><div class="modal-footer"><button type="button" class="btn" onclick="closeModal()">Cancelar</button><button class="btn primary">Salvar cliente</button></div></form>`);document.querySelector('#clientForm').onsubmit=e=>{e.preventDefault();let d=Object.fromEntries(new FormData(e.target));if(idx!==undefined)clients[idx]={...clients[idx],...d};else clients.unshift({...d,history:[]});persist();closeModal();renderClients();toast('Cliente salvo.')}}function renderImport(){view.innerHTML=pageHead('Importar dados','Faça backup dos cadastros ou importe uma planilha para atualizar a carteira.')+`<article class="card panel"><div class="panel-head"><div><h2>Cópia de segurança</h2><span>Empreendimentos, clientes, histórico e pesquisas salvas</span></div><div class="actions"><button class="btn primary" onclick="downloadBackup()">Exportar backup</button><label class="btn" for="backupInput">Restaurar backup</label><input id="backupInput" type="file" accept="application/json,.json" style="display:none" onchange="restoreBackup(this.files[0])"></div></div><p class="sub">O arquivo exportado contém os dados salvos neste navegador. Guarde-o para recuperar os cadastros.</p></article><article class="card panel" style="margin-top:16px"><div class="notice"><b>Fonte inicial conferida:</b> arquivo PRODUTOS MCMV.xlsx, abas MCMV (30 registros) e MÉDIO (19 registros). Os valores originais foram preservados.</div><div class="upload" onclick="document.querySelector('#fileInput').click()"><div style="font-size:24px">⇧</div><strong>Selecione uma planilha para pré-visualizar</strong><span>Arquivos .xlsx, .xls ou .csv</span><input type="file" id="fileInput" accept=".xlsx,.xls,.csv" onchange="readImport(this.files[0])"></div><div class="field" style="margin-top:18px"><label>Como importar atualizações</label><select id="importMode"><option value="review">Revisar alterações antes de atualizar registros existentes</option><option value="add">Adicionar somente registros novos</option></select></div><div id="importPreview"></div></article><article class="card panel" style="margin-top:16px"><div class="panel-head"><h2>Critérios de identificação</h2><span>Para evitar duplicidades</span></div><p class="sub" style="line-height:1.7">A comparação usa categoria, construtora e nome em conjunto. Alterações aparecem em prévia antes da confirmação.</p></article>`}function downloadBackup(){let backup={format:'central-imobiliaria-backup',version:1,exportedAt:new Date().toISOString(),properties,clients,savedSearch};let blob=new Blob([JSON.stringify(backup,null,2)],{type:'application/json'}),url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download='backup-central-imobiliaria-'+new Date().toISOString().slice(0,10)+'.json';a.click();setTimeout(()=>URL.revokeObjectURL(url),1000);toast('Backup exportado.')}async function restoreBackup(file){if(!file)return;try{let backup=JSON.parse(await file.text());if(!backup||!Array.isArray(backup.properties)||!Array.isArray(backup.clients)||!Array.isArray(backup.savedSearch))throw new Error('Este arquivo não parece ser um backup válido da Central Imobiliária.');if(!confirm(`Restaurar o backup de ${backup.properties.length} empreendimentos e ${backup.clients.length} clientes? Os dados salvos neste navegador serão substituídos.`))return;properties=backup.properties.map(x=>{let base=window.INITIAL_PROPERTIES.find(b=>b.id===x.id);return base?{...x,...(base.coverUrl?{coverUrl:base.coverUrl}:{}),...(base.catalogInfo?{catalogInfo:base.catalogInfo}:{}),...(base.availabilityTable?{availabilityTable:base.availabilityTable}:{})}:x});clients=backup.clients;savedSearch=backup.savedSearch.map((x,i)=>typeof x==='string'?{name:'Pesquisa '+(i+1),text:x}:x);persist();toast('Backup restaurado.');go('dashboard')}catch(e){toast(e.message||'Não foi possível restaurar o backup.',true)}finally{let i=document.querySelector('#backupInput');if(i)i.value=''}}function deleteClient(i){if(confirm('Arquivar este cliente?')){clients.splice(i,1);persist();renderClients();toast('Cliente arquivado.')}}
function loadXlsx(){return new Promise((resolve,reject)=>{if(window.XLSX)return resolve();let s=document.createElement('script');s.src='https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js';s.onload=resolve;s.onerror=()=>reject(new Error('Não foi possível carregar o leitor Excel. Verifique a conexão e tente novamente.'));document.head.append(s)})}function mappedRows(rows,sheet){let normh=s=>norm(s).replace(/[^a-z0-9]/g,'');return rows.filter(r=>Object.values(r).some(v=>v!==''&&v!=null)).map((r,i)=>{let get=(...names)=>{let k=Object.keys(r).find(h=>names.some(n=>normh(h)===normh(n)));return k?r[k]:''};let name=get('EMPREEND.','EMPREENDIMENTO','NOME');let developer=get('CONSTRUT.','CONSTRUTORA','CONSTRUTOR');let region=get('REGIÃO','REGIAO');let area=get('METRAGEM','ÁREA','AREA');let p=get('VALOR','PREÇO','PRECO');let priceN=typeof p==='number'?p:p?Number(String(p).replace(/[^\d,.-]/g,'').replace(/\./g,'').replace(',','.')):null;let deliver=get('ENTREGA','ENTREGA2');let category=normh(sheet).includes('mcmv')?'MCMV':'Médio';return {id:'import-'+Date.now()+'-'+i,category,name:String(name||'').trim(),developer:String(developer||'').trim(),region:String(region||'').trim(),deliveryRaw:deliver instanceof Date?deliver.toLocaleDateString('pt-BR'):String(deliver||'').trim(),delivery:null,areaRaw:String(area||'').trim(),areas:(String(area||'').match(/\d+(?:[,.]\d+)?/g)||[]).map(v=>parseFloat(v.replace(',','.'))),price:Number.isFinite(priceN)?priceN:null,priceRaw:String(p||''),roomsRaw:String(get('QUARTOS')||''),features:Object.fromEntries(Object.entries(r).filter(([k])=>/sacada|churras|elevador|garden|piscina|suite|vaga/i.test(k)).map(([k,v])=>[k,String(v||'').trim()])),raw:r,sourceSheet:sheet,sourceRow:i+2,needsReview:!name||!area||!Number.isFinite(priceN)}})}async function readImport(file){if(!file)return;try{await loadXlsx();let data=await file.arrayBuffer(),wb=XLSX.read(data,{type:'array',cellDates:true});importRows=[];wb.SheetNames.forEach(sn=>{let rows=XLSX.utils.sheet_to_json(wb.Sheets[sn],{defval:'',raw:true});importRows.push(...mappedRows(rows,sn))});if(file.name.toLowerCase().endsWith('.csv')&&!importRows.length)throw new Error('Não foi possível identificar registros no CSV.');drawPreview()}catch(e){toast(e.message,true)}}function drawPreview(){let el=document.querySelector('#importPreview');if(!el)return;let incoming=importRows.map(x=>{let idx=properties.findIndex(p=>p.category===x.category&&norm(p.name)===norm(x.name)&&norm(p.developer)===norm(x.developer));return {...x,match:idx}});let dup=incoming.filter(x=>x.match>=0),fresh=incoming.filter(x=>x.match<0);el.innerHTML=`<div class="panel-head" style="margin-top:22px"><h2>Prévia da importação</h2><span>${importRows.length} linhas válidas</span></div><div class="grid stats" style="grid-template-columns:repeat(3,1fr)">${stat('Novos registros',fresh.length,'Ainda não identificados','＋')}${stat('Possíveis atualizações',dup.length,'Exigem conferência','↻')}${stat('Precisam de revisão',incoming.filter(x=>x.needsReview).length,'Campos em branco ou não reconhecidos','!')}</div><div class="table-wrap"><table class="table"><thead><tr><th>EMPREENDIMENTO</th><th>CATEGORIA / ORIGEM</th><th>REGIÃO</th><th>PREÇO</th><th>SITUAÇÃO</th></tr></thead><tbody>${incoming.slice(0,100).map(x=>`<tr><td><b>${h(x.name||'Sem nome')}</b><small>${h(x.developer)}</small></td><td>${h(x.category)}<small>${h(x.sourceSheet)}</small></td><td>${h(x.region||'—')}</td><td>${price(x.price)}</td><td><span class="pill ${x.match>=0?'gold':'green'}">${x.match>=0?'Conferir alteração':'Novo'}</span>${x.needsReview?'<small>Revisão necessária</small>':''}</td></tr>`).join('')}</tbody></table></div>${incoming.length>100?`<p class="sub">Prévia mostra 100 de ${incoming.length} registros.</p>`:''}<div class="modal-footer"><button class="btn" onclick="importRows=[];document.querySelector('#importPreview').innerHTML='';toast('Prévia descartada.')">Descartar</button><button class="btn primary" onclick="confirmImport()">Confirmar importação</button></div>`}function confirmImport(){let mode=document.querySelector('#importMode').value;let added=0,updated=0,ignored=0;for(let x of importRows){let idx=properties.findIndex(p=>p.category===x.category&&norm(p.name)===norm(x.name)&&norm(p.developer)===norm(x.developer));if(idx>=0){if(mode==='add'){ignored++;continue}let current=properties[idx];let changes=Object.keys(x).filter(k=>!['id','raw','sourceRow','needsReview'].includes(k)&&String(current[k]??'')!==String(x[k]??''));if(!changes.length){ignored++;continue}if(!confirm(`Atualizar ${x.name} (${x.category})?\n\nCampos com diferença: ${changes.join(', ')}\n\nOs dados atuais serão substituídos pelos dados da planilha.`)){ignored++;continue}properties[idx]={...current,...x,id:current.id,availability:current.availability||'',dataUpdatedAt:current.dataUpdatedAt||'',dataSource:'Planilha importada'};updated++}else{properties.unshift({...x,availability:'',dataUpdatedAt:'',dataSource:'Planilha importada'});added++}}persist();importRows=[];toast(`Importação concluída: ${added} novos, ${updated} atualizados, ${ignored} ignorados.`);go('import')}
function go(p){active=p;document.querySelectorAll('#nav button').forEach(b=>b.classList.toggle('active',b.dataset.page===p));document.querySelector('#crumb').textContent=pages[p];document.querySelector('#sidebar').classList.remove('open');({dashboard:renderDashboard,properties:renderProperties,search:renderSearch,clients:renderClients,import:renderImport}[p])()}document.querySelector('#nav').onclick=e=>{let b=e.target.closest('button[data-page]');if(b)go(b.dataset.page)};document.querySelector('#menuBtn').onclick=()=>document.querySelector('#sidebar').classList.toggle('open');function render(){go(active)}render();
